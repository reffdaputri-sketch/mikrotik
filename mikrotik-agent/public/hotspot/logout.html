<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PurnamaWiFi - Keluar</title>
    <!-- Outfit Font -->
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;700;800&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Outfit', sans-serif;
        }
        body {
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            position: relative;
            color: #f8fafc;
        }
        /* Aurora Glowing Circles */
        .aurora {
            position: absolute;
            width: 300px;
            height: 300px;
            border-radius: 50%;
            filter: blur(100px);
            opacity: 0.5;
            z-index: 0;
            animation: float 10s ease-in-out infinite alternate;
        }
        .aurora-1 {
            background: #4f46e5;
            top: 10%;
            left: 10%;
        }
        .aurora-2 {
            background: #06b6d4;
            bottom: 10%;
            right: 10%;
            animation-delay: -5s;
        }
        @keyframes float {
            0% { transform: translateY(0px) scale(1); }
            100% { transform: translateY(50px) scale(1.2); }
        }
        /* Glass Card */
        .card {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px 30px;
            width: 90%;
            max-width: 400px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            z-index: 10;
            position: relative;
        }
        .goodbye-icon {
            font-size: 3rem;
            margin-bottom: 20px;
            display: inline-block;
        }
        .brand-name {
            font-size: 1.8rem;
            font-weight: 800;
            background: linear-gradient(to right, #38bdf8, #818cf8);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            letter-spacing: 1px;
        }
        .tagline {
            font-size: 0.9rem;
            color: #94a3b8;
            margin-top: 5px;
            margin-bottom: 30px;
        }
        .info-box {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.05);
            padding: 20px;
            border-radius: 16px;
            margin-bottom: 30px;
            text-align: left;
        }
        .info-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 10px;
            font-size: 0.9rem;
        }
        .info-row:last-child {
            margin-bottom: 0;
        }
        .info-label {
            color: #94a3b8;
        }
        .info-value {
            color: #ffffff;
            font-weight: 600;
        }
        .btn-login {
            width: 100%;
            background: linear-gradient(135deg, #4f46e5 0%, #06b6d4 100%);
            border: none;
            padding: 16px;
            border-radius: 14px;
            color: white;
            font-size: 1.1rem;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 10px 20px rgba(79, 70, 229, 0.3);
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        .btn-login:hover {
            transform: translateY(-2px);
            box-shadow: 0 15px 30px rgba(6, 182, 212, 0.4);
        }
    </style>
</head>
<body>
    <div class="aurora aurora-1"></div>
    <div class="aurora aurora-2"></div>

    <div class="card">
        <span class="goodbye-icon">👋</span>
        <div class="brand-name">PURNAMAWIFI</div>
        <div class="tagline">Koneksi Anda telah diputuskan</div>

        <div class="info-box">
            <div class="info-row">
                <span class="info-label">Username</span>
                <span class="info-value">$(username)</span>
            </div>
            <div class="info-row">
                <span class="info-label">Total Uptime</span>
                <span class="info-value">$(uptime)</span>
            </div>
            <div class="info-row">
                <span class="info-label">Total Traffic</span>
                <span class="info-value">$(bytes-out-nice)</span>
            </div>
        </div>

        <form action="$(link-login)" name="login">
            <button class="btn-login" type="submit">Masuk Kembali</button>
        </form>
    </div>
</body>
</html>
