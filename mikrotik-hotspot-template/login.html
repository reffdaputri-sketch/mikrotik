<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WiFi Login | NuxBill Premium</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #3b82f6;
            --secondary: #8b5cf6;
            --accent: #10b981;
            --bg: #0f172a;
            --glass: rgba(30, 41, 59, 0.7);
            --glass-border: rgba(255, 255, 255, 0.1);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Outfit', sans-serif;
        }

        body {
            background-color: var(--bg);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(59, 130, 246, 0.15) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(139, 92, 246, 0.15) 0%, transparent 40%);
            color: #f1f5f9;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
            background: var(--glass);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            padding: 32px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 0.8s ease-out;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .logo {
            width: 60px;
            height: 60px;
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            border-radius: 16px;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(59, 130, 246, 0.3);
        }

        .logo svg {
            width: 32px;
            height: 32px;
            fill: white;
        }

        h1 {
            font-size: 24px;
            font-weight: 800;
            margin-bottom: 8px;
            letter-spacing: -0.5px;
        }

        .subtitle {
            font-size: 14px;
            color: #94a3b8;
            margin-bottom: 32px;
        }

        .login-box {
            margin-bottom: 24px;
        }

        input[type="text"] {
            width: 100%;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid var(--glass-border);
            border-radius: 12px;
            padding: 14px 16px;
            color: white;
            font-size: 16px;
            text-align: center;
            margin-bottom: 16px;
            transition: all 0.3s;
            letter-spacing: 2px;
            font-weight: 600;
        }

        input[type="text"]:focus {
            outline: none;
            border-color: var(--primary);
            box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.2);
        }

        .btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 100%;
            padding: 14px;
            border-radius: 12px;
            font-weight: 700;
            font-size: 16px;
            cursor: pointer;
            transition: all 0.3s;
            border: none;
            text-decoration: none;
            margin-bottom: 12px;
        }

        .btn-primary {
            background: linear-gradient(135deg, var(--primary), var(--secondary));
            color: white;
            box-shadow: 0 4px 15px rgba(59, 130, 246, 0.4);
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(59, 130, 246, 0.6);
        }

        .divider {
            display: flex;
            align-items: center;
            margin: 24px 0;
            color: #475569;
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .divider::before, .divider::after {
            content: "";
            flex: 1;
            height: 1px;
            background: #1e293b;
        }

        .divider span {
            padding: 0 12px;
        }

        .btn-outline {
            background: rgba(16, 185, 129, 0.1);
            color: #10b981;
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        .btn-outline:hover {
            background: rgba(16, 185, 129, 0.2);
            border-color: #10b981;
        }

        .footer {
            margin-top: 32px;
            font-size: 12px;
            color: #64748b;
        }

        .pricing-list {
            margin-top: 24px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }

        .price-item {
            background: rgba(255, 255, 255, 0.03);
            border-radius: 12px;
            padding: 12px;
            text-align: left;
            border: 1px solid var(--glass-border);
        }

        .price-name {
            font-size: 11px;
            color: #94a3b8;
            font-weight: 600;
        }

        .price-val {
            font-size: 14px;
            font-weight: 800;
            color: #f1f5f9;
        }

        /* MikroTik Specific Tags */
        .error {
            color: #f87171;
            font-size: 13px;
            margin-bottom: 16px;
        }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">
            <svg viewBox="0 0 24 24">
                <path d="M12,11c-1.1,0-2,0.9-2,2s0.9,2,2,2s2-0.9,2-2S13.1,11,12,11z M18,13c0-3.3-2.7-6-6-6s-6,2.7-6,6c0,2.2,1.2,4.1,3,5.2V21h6v-2.8 C16.8,17.1,18,15.2,18,13z M12,3c-5.5,0-10,4.5-10,10c0,3.7,2,6.9,5,8.7V23h10v-1.3c3-1.8,5-5,5-8.7C22,7.5,17.5,3,12,3z"/>
            </svg>
        </div>

        <h1>Selamat Datang</h1>
        <p class="subtitle">Silakan masukkan kode voucher untuk akses internet cepat</p>

        <!-- Error Message from MikroTik -->
        $(if error)
        <div class="error">$(error)</div>
        $(endif)

        <form name="login" action="$(link-login-only)" method="post" $(if chap-id) onSubmit="return doLogin()" $(endif)>
            <input type="hidden" name="dst" value="$(link-orig)" />
            <input type="hidden" name="popup" value="true" />
            
            <div class="login-box">
                <input name="username" type="text" value="$(username)" placeholder="KODE VOUCHER" autocomplete="off" required />
                <!-- Password is same as username for most voucher systems -->
                <input name="password" type="hidden" value="$(username)" />
                
                <button type="submit" class="btn btn-primary">HUBUNGKAN SEKARANG</button>
            </div>
        </form>

        <div class="divider">
            <span>Atau</span>
        </div>

        <p class="subtitle" style="margin-bottom: 12px;">Belum punya voucher?</p>
        <a href="http://192.168.100.1/beli" class="btn btn-outline" id="buy-btn">BELI VOUCHER ONLINE</a>

        <div class="pricing-list">
            <div class="price-item">
                <div class="price-name">HEMAT 2 JAM</div>
                <div class="price-val">RM 1.00</div>
            </div>
            <div class="price-item">
                <div class="price-name">PUAS 24 JAM</div>
                <div class="price-val">RM 5.00</div>
            </div>
        </div>

        <div class="footer">
            &copy; 2025 NuxBill Premium WiFi<br>
            Powered by toyyibPay 🇲🇾
        </div>
    </div>

    <script>
        // Update URL Beli dengan IP Router atau Domain Kamu
        // Ganti http://localhost:3000 dengan domain aslimu nanti
        document.getElementById('buy-btn').href = "http://localhost:3000/beli";
    </script>

</body>
</html>
